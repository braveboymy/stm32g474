{
  "project": "STM32G474 电机控制固件（NUCLEO-G474RE）",
  "build": {
    "dir": "build",
    "generator": "Ninja",
    "toolchain": "cmake/toolchain-arm-none-eabi.cmake"
  },
  "jlink": {
    "device": "STM32G474RE",
    "interface": "SWD",
    "speed": "4000"
  },
  "bins": [
    { "name": "bootloader", "path": "build/bin/bootloader.bin", "addr": "0x08000000" },
    { "name": "app", "path": "build/bin/app.bin", "addr": "0x08008000" }
  ],
  "log": {
    "ram_buf_size": 2048,
    "map": "build/app.map",
    "note": "ram_buf_size 需与 core/log/log.c 的 s_ram_buf 定义一致"
  },
  "status": {
    "regs": [
      ["0x40001024", "TIM6 CNT（HAL 时间基准，1kHz 递增）"],
      ["0x48000814", "GPIOC ODR（LED1 PC13 位 13）"],
      ["0x48000C14", "GPIOD ODR（LED2 PD2 位 2）"]
    ],
    "hard_metric": "TIM6"
  },
  "misra": {
    "dirs": ["core", "bsp", "app", "bootloader"],
    "includes": [
      "-Iconfig", "-Icore", "-Ibsp", "-Iapp",
      "-Ithird_party/STM32CubeG4/Drivers/STM32G4xx_HAL_Driver/Inc",
      "-Ithird_party/STM32CubeG4/Drivers/CMSIS/Device/ST/STM32G4xx/Include",
      "-Ithird_party/STM32CubeG4/Drivers/CMSIS/Include",
      "-Ithird_party/FreeRTOS-Kernel/include",
      "-Ithird_party/FreeRTOS-Kernel/portable/GCC/ARM_CM4F"
    ],
    "defs": ["-DSTM32G474xx", "-DUSE_HAL_DRIVER", "-DVECT_TAB_OFFSET=0x00008000U"]
  },
  "tests": {
    "dirs": ["tests/core", "tests/app"],
    "includes": ["core", "core/osal", "core/util", "core/log", "app", "app/conn", "tests/core"],
    "sources": {
      "test_rb": ["tests/core/test_rb.c", "core/util/rb.c"],
      "test_log": ["tests/core/test_log.c", "core/log/log.c", "core/util/rb.c", "tests/core/mock_osal.c"],
      "test_at": ["tests/app/test_at.c", "app/conn/at.c"]
    }
  }
}